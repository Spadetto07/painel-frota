<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — Painel de Frota</title>
<link rel="icon" href="../icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F6F8; --surf:#FFFFFF; --surf2:#EDF1F4;
  --line:#DCE3E8; --ink:#141F29; --ink2:#475763; --ink3:#6E7E8A;
  --accent:#1E5C7E;
  --good:#1F7A4D; --good-bg:#E6F4EC; --bad:#B4402A; --bad-bg:#FBEAE6;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10161B; --surf:#182129; --surf2:#1F2A33; --line:#2C3A44;
    --ink:#E8EEF2; --ink2:#A9B8C2; --ink3:#7C8B96; --accent:#74B4D4;
    --good:#4ADE80; --good-bg:#0F2A1C; --bad:#F87171; --bad-bg:#3A1512; }
}
*{box-sizing:border-box}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:24px}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;margin:0 0 20px}
.abas{display:flex;gap:8px;margin-bottom:16px}
.abas button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink2);cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.abas button.ativa{background:var(--accent);border-color:var(--accent);color:#fff}
.tabela-wrap{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--ink3);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
button.aprovar{background:var(--good);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-right:6px;font:inherit;font-weight:600}
button.rejeitar{background:var(--bad);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
.vazio{color:var(--ink3);padding:24px;text-align:center}
.pill{padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill-sucesso{background:var(--good-bg);color:var(--good)}
.pill-falha{background:var(--bad-bg);color:var(--bad)}
td.mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
</style>
</head>
<body>
  <h1>Administração — Painel de Frota</h1>

  <div class="abas">
    <button id="abaPendentes" class="ativa">Cadastros pendentes</button>
    <button id="abaHistorico">Histórico de acesso</button>
  </div>

  <div id="secaoPendentes">
    <div class="tabela-wrap">
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Obra</th><th>Pedido em</th><th>Ação</th></tr></thead>
        <tbody id="corpoPendentes"></tbody>
      </table>
    </div>
  </div>

  <div id="secaoHistorico" style="display:none">
    <div class="tabela-wrap">
      <table>
        <thead><tr><th>Quando</th><th>Identificador</th><th>Resultado</th><th>Motivo</th><th>IP</th><th>Navegador</th></tr></thead>
        <tbody id="corpoHistorico"></tbody>
      </table>
    </div>
  </div>

<script>
  async function carregarPendentes(){
    const resp = await fetch('/admin/api/pendentes');
    const dados = await resp.json();
    const corpo = document.getElementById('corpoPendentes');
    if (!dados.pendentes.length){
      corpo.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum cadastro pendente.</td></tr>';
      return;
    }
    corpo.innerHTML = dados.pendentes.map(p => `
      <tr>
        <td>${p.nome}</td>
        <td>${p.email}</td>
        <td>${p.telefone || ''}</td>
        <td>${p.obra || ''}</td>
        <td>${new Date(p.criado_em + 'Z').toLocaleString('pt-BR')}</td>
        <td>
          <button class="aprovar" data-id="${p.id}">Aprovar</button>
          <button class="rejeitar" data-id="${p.id}">Rejeitar</button>
        </td>
      </tr>
    `).join('');

    corpo.querySelectorAll('.aprovar').forEach(b => b.addEventListener('click', () => decidir(b.dataset.id, 'aprovar')));
    corpo.querySelectorAll('.rejeitar').forEach(b => b.addEventListener('click', () => decidir(b.dataset.id, 'rejeitar')));
  }

  async function decidir(id, acao){
    await fetch(`/admin/api/${acao}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: Number(id) }),
    });
    carregarPendentes();
  }

  async function carregarHistorico(){
    const resp = await fetch('/admin/api/historico');
    const dados = await resp.json();
    const corpo = document.getElementById('corpoHistorico');
    if (!dados.registros.length){
      corpo.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum acesso registrado ainda.</td></tr>';
      return;
    }
    corpo.innerHTML = dados.registros.map(r => `
      <tr>
        <td>${new Date(r.quando + 'Z').toLocaleString('pt-BR')}</td>
        <td>${r.identificador}</td>
        <td><span class="pill ${r.resultado === 'sucesso' ? 'pill-sucesso' : 'pill-falha'}">${r.resultado}</span></td>
        <td>${r.motivo}</td>
        <td class="mono">${r.ip || ''}</td>
        <td>${r.user_agent || ''}</td>
      </tr>
    `).join('');
  }

  document.getElementById('abaPendentes').addEventListener('click', () => {
    document.getElementById('abaPendentes').classList.add('ativa');
    document.getElementById('abaHistorico').classList.remove('ativa');
    document.getElementById('secaoPendentes').style.display = 'block';
    document.getElementById('secaoHistorico').style.display = 'none';
  });
  document.getElementById('abaHistorico').addEventListener('click', () => {
    document.getElementById('abaHistorico').classList.add('ativa');
    document.getElementById('abaPendentes').classList.remove('ativa');
    document.getElementById('secaoHistorico').style.display = 'block';
    document.getElementById('secaoPendentes').style.display = 'none';
    carregarHistorico();
  });

  carregarPendentes();
</script>
</body>
</html>
